name: Inspiration4 OSD-575 IHB vs First Place

on:
  push:
    branches:
      - counterfactual/inspiration4-frozen-ihb
    paths:
      - 'counterfactual/inspiration4/run_osd575_headtohead.py'
      - 'counterfactual/inspiration4/HEADTOHEAD_REQUEST.md'
      - '.github/workflows/inspiration4-osd575-headtohead.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  head-to-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ARC counterfactual branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=2.0,<3' 'pandas>=2.2,<3'
      - name: Run exact OSD-575 head-to-head
        run: python counterfactual/inspiration4/run_osd575_headtohead.py
      - name: Show comparison summary
        run: cat counterfactual/inspiration4/headtohead_outputs/headtohead_summary.json
      - name: Show IHB recovery summary
        run: cat counterfactual/inspiration4/headtohead_outputs/IHB_OSD575_subject_recovery_summary.csv
      - name: Upload head-to-head bundle
        uses: actions/upload-artifact@v4
        with:
          name: ihb-vs-first-place-osd575-headtohead
          path: |
            counterfactual/inspiration4/headtohead_outputs/
            counterfactual/inspiration4/headtohead_source/
          if-no-files-found: error
          retention-days: 30
